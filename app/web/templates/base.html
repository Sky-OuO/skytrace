<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}SkyTrace{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: "#f3efe7",
            ink: "#221c16",
            stamp: "#8f3d2a"
          },
          fontFamily: {
            sans: ['"Noto Sans SC"', '"Source Han Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', '"Noto Sans CJK SC"', "sans-serif"],
            serif: ['"Iowan Old Style"', "Palatino", '"Songti SC"', '"Noto Serif SC"', "serif"]
          }
        }
      }
    }
  </script>
  <style>
    body { background: #f3efe7; color: #221c16; }
    :focus-visible { outline: 2px solid #8f3d2a; outline-offset: 3px; }
    .section-nav { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 0.4rem; background: rgba(243,239,231,0.95); padding: 0.75rem 0; }
    .section-nav a { border: 1px solid #d6d0c6; border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.85rem; background: white; }
    .topic-section { margin-top: 2.5rem; scroll-margin-top: 3.5rem; }
    .guide-list { margin-top: 0.8rem; display: grid; gap: 0.55rem; }
    .guide-line { list-style: none; border-left: 2px solid #8f3d2a; padding-left: 0.75rem; line-height: 1.6; }
    .example-fold { margin-top: 1rem; border: 1px dashed #c4bdb2; background: white; padding: 0.8rem 1rem; }
    .example-fold summary { cursor: pointer; font-size: 0.9rem; }
    .example-fold li { margin-top: 0.8rem; font-size: 0.92rem; line-height: 1.55; }
    .verify { margin-left: 0.4rem; font-size: 0.75rem; color: #6b6258; }
    .geo { color: #6b6258; font-size: 0.8rem; }
    .note-card, .highlight-card { margin-top: 1rem; background: white; border: 1px solid #e4ddd2; padding: 0.9rem; }
    .work-on, .highlight-card { outline: 2px solid #8f3d2a; }
    .note-card img, .highlight-card img { width: 100%; height: auto; display: block; }
    .sample-flag { margin-top: 0.35rem; font-size: 0.75rem; letter-spacing: 0.08em; color: #6b6258; }
    .note-card dl { margin-top: 0.6rem; display: grid; grid-template-columns: 7rem 1fr; gap: 0.25rem 0.6rem; font-size: 0.9rem; }
    .byline, .empty-note { margin-top: 0.6rem; font-size: 0.8rem; color: #6b6258; }
    @media (max-width: 640px) {
      .note-card dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased">
  <a href="#content" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:bg-white focus:px-3 focus:py-2">跳到正文</a>
  <header class="border-b border-stone-300">
    <div class="mx-auto flex max-w-5xl flex-wrap items-end justify-between gap-x-8 gap-y-4 px-4 py-5 sm:px-6">
      <a href="/" class="block">
        <span class="font-serif text-2xl tracking-wide">SkyTrace</span>
        <span class="mt-1 block text-xs tracking-[0.18em] text-stone-500">摄影题材怎么拍</span>
      </a>
      <nav aria-label="主导航" class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
        <a href="/" class="{% if active == 'home' %}font-medium text-stamp{% endif %}">首页</a>
        <a href="/c/portrait" class="{% if active == 'portrait' %}font-medium text-stamp{% endif %}">人像</a>
        <a href="/c/landscape" class="{% if active == 'landscape' %}font-medium text-stamp{% endif %}">风光</a>
        <a href="/search" class="{% if active == 'search' %}font-medium text-stamp{% endif %}">搜索</a>
        <a href="/publish" class="{% if active == 'publish' %}font-medium text-stamp{% endif %}">记一笔</a>
        {% if current_user %}
          <span class="text-stone-600">{{ current_user.display_name }}</span>
          <form method="post" action="/logout" class="inline">
            <button type="submit" class="underline decoration-stone-400 underline-offset-4">登出</button>
          </form>
        {% else %}
          <a href="/login" class="{% if active == 'login' %}font-medium text-stamp{% endif %}">登录</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main id="content" class="mx-auto max-w-5xl px-4 py-10 sm:px-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-stone-300">
    <p class="mx-auto max-w-5xl px-4 py-6 text-xs text-stone-500 sm:px-6">按题材把成片和拍法放在同一页。本地演示，不开放注册。图片如无另注，都是示例图。</p>
  </footer>
</body>
</html>
