<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f5f2">
  <title>{% block title %}SkyTrace{% endblock %}</title>
  <link rel="stylesheet" href="/static/site.css">
  <script>document.documentElement.classList.add("js")</script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="/static/site.js" defer></script>
</head>
<body hx-boost="true">
  <a href="#content" class="sr-only">跳到正文</a>
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="/">SkyTrace</a>
      <nav class="nav" aria-label="主导航">
        <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>首页</a>
        <a href="/portrait" {% if active == 'portrait' %}aria-current="page"{% endif %}>人像</a>
        <a href="/landscape" {% if active == 'landscape' %}aria-current="page"{% endif %}>风光</a>
        <a href="/search" {% if active == 'search' %}aria-current="page"{% endif %}>搜索</a>
        <a href="/publish" {% if active == 'publish' %}aria-current="page"{% endif %}>记一笔</a>
        {% if current_user %}
          <a href="/me" {% if active == 'me' %}aria-current="page"{% endif %}>{{ current_user.display_name }}</a>
          {% if current_user.role == 'reviewer' %}
            <a href="/review" {% if active == 'review' %}aria-current="page"{% endif %}>审核</a>
          {% endif %}
          <form method="post" action="/logout" hx-boost="false">
            <button type="submit">登出</button>
          </form>
        {% else %}
          <a href="/login" {% if active == 'login' %}aria-current="page"{% endif %}>登录</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <div class="topbar-space"></div>
  <main id="content" class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <p>按题材把成片和拍法放在同一页。本地演示，不开放注册。图片如无另注，都是示例图。</p>
  </footer>
</body>
</html>
