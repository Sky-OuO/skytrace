<a class="card" href="/s/{{ card.slug }}?work={{ card.id }}">
  {% if card.image %}
    <img src="{{ card.image }}" alt="{{ card.alt }}" width="{{ card.width or 900 }}" height="{{ card.height or 1200 }}">
  {% endif %}
  <span class="sample-flag">示例图</span>
  <span class="card-body">
    <span class="topic-chip">{{ card.topic }}</span>
    <strong class="card-title">{{ card.title }}</strong>
    {% if card.tip %}<span class="tip">{{ card.tip }}</span>{% endif %}
    <span class="byline">{{ card.author }}</span>
  </span>
</a>
