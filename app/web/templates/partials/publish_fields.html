{% if note_type == "finished" %}
  <label class="field" for="body">一句拍摄说明
    <textarea id="body" name="body" rows="3" placeholder="例如：阴天窗光作主光，身干与窗大约四十五度，近处暖灯关掉。">{{ body }}</textarea>
  </label>
{% else %}
  <label class="field" for="body">补充一句，可选
    <textarea id="body" name="body" rows="2">{{ body }}</textarea>
  </label>
  {% for key, label, required in field_inputs %}
    <label class="field" for="field-{{ key }}">{{ label }}{% if required %}（必填）{% endif %}
      <textarea id="field-{{ key }}" name="field_{{ key }}" rows="2" {% if required %}data-required="1"{% endif %}></textarea>
    </label>
  {% endfor %}
{% endif %}
{% if needs_auth %}
  <label class="choice">
    <input type="checkbox" name="portrait_auth" value="on">
    可展示 / 肖像授权：画面里能认出的人已经同意公开展示
  </label>
{% endif %}
