{% extends "base.html" %}
{% block title %}{{ channel.name }} · SkyTrace{% endblock %}
{% block content %}
  <p class="text-xs tracking-[0.22em] text-stone-500">频道占位</p>
  <h1 class="mt-3 font-serif text-4xl">{{ channel.name }}</h1>
  <p class="mt-4 max-w-2xl text-sm leading-7 text-stone-700">频道列表还没做。这一页只确认入口，完整浏览留到后面。</p>
  {% if channel.code == "culture" %}
    <p class="mt-6 border border-stone-300 bg-white/70 p-5 text-sm leading-7">人文频道这两周没有种子对象。</p>
  {% else %}
    <p class="mt-6 text-sm leading-7 text-stone-700">{{ channel.summary }}</p>
  {% endif %}
{% endblock %}
