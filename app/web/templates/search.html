{% extends "base.html" %}
{% block title %}搜索 · SkyTrace{% endblock %}
{% block content %}
  <p class="text-xs tracking-[0.22em] text-stone-500">搜索占位</p>
  <h1 class="mt-3 font-serif text-4xl">搜索</h1>
  <form action="/search" method="get" class="mt-6 flex max-w-xl gap-2">
    <label class="sr-only" for="q">搜索词</label>
    <input id="q" name="q" type="search" value="{{ q }}" placeholder="对象、机位或光线" class="w-full border border-stone-400 bg-white px-3 py-2 text-sm">
    <button type="submit" class="bg-ink px-4 py-2 text-sm text-paper">搜索</button>
  </form>
  <p class="mt-4 max-w-2xl text-sm leading-7 text-stone-700">搜索查询还没开放。全文索引已经建在数据库里，结果列表会在后面接上。</p>
  {% if q %}
    <p class="mt-4 text-sm">已记下搜索词「{{ q }}」，这次不会返回结果。</p>
  {% endif %}
{% endblock %}
