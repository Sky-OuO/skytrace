{% extends "base.html" %}
{% block title %}登录 · SkyTrace{% endblock %}
{% block content %}
  <div class="narrow">
    <h1 class="page-title">登录</h1>
    <p class="lede">只接受预置帐号。没有注册入口。</p>
    {% if error %}
      <p role="alert" class="field-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" hx-boost="false">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field" for="email">邮箱
        <input id="email" name="email" type="email" autocomplete="username" required>
      </label>
      <label class="field" for="password">密码
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="actions">
        <button class="btn" type="submit">登录</button>
      </div>
    </form>
  </div>
{% endblock %}
