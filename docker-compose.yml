services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skytrace
      POSTGRES_PASSWORD: skytrace
      POSTGRES_DB: skytrace
    ports:
      - "5432:5432"
    volumes:
      - skytrace_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skytrace -d skytrace"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  skytrace_pg:
