[project]
name = "skytrace"
version = "0.1.0"
description = "SkyTrace 摄影对象知识库原型"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "fastapi-users[sqlalchemy]>=14",
    "pwdlib[argon2]>=0.2",
    "redis>=5",
    "arq>=0.26",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pillow>=11",
    "authlib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "templates/partials/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*session.exec.*:DeprecationWarning",
]
